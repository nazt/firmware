[env:custom_sx1280_board_s3]
; Custom ESP32-S3 board with SX1280 2.4GHz LoRa module
board_level = extra
extends = esp32s3_base
board = esp32-s3-devkitc-1

; ESP32-S3 specific configuration
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

; CPU frequency for optimal performance
board_build.f_cpu = 240000000L

; Upload configuration
upload_protocol = esptool
upload_port = /dev/ttyACM0
upload_speed = 921600
monitor_speed = 115200
monitor_port = /dev/ttyACM0

; Build flags specific to this variant
build_flags = 
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D CUSTOM_SX1280_BOARD_S3
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/diy/custom_sx1280_board
  -D USE_USB_CDC
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D Serial=Serial0
  -O2

; Library dependencies (inherits from esp32s3_base)
lib_deps =
  ${esp32s3_base.lib_deps}

; Debug flags (optional, uncomment for debugging)
; debug_tool = esp-prog
; debug_init_break = tbreak setup