[env:custom_sx1280_board]
; Custom ESP32 board with SX1280 2.4GHz LoRa module
board_level = extra
extends = esp32_base
board = esp32doit-devkit-v1
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = dio

; CPU frequency for optimal performance
board_build.f_cpu = 240000000L

; Upload configuration
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200

; Build flags specific to this variant
build_flags = 
  ${esp32_base.build_flags}
  -D PRIVATE_HW
  -D CUSTOM_SX1280_BOARD
  -I variants/esp32/diy/custom_sx1280_board
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -O2

; Library dependencies (inherits from esp32_base)
lib_deps =
  ${esp32_base.lib_deps}

; Debug flags (optional, uncomment for debugging)
; debug_tool = esp-prog
; debug_init_break = tbreak setup